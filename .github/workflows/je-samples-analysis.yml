name: JE Samples Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "je_samples.xlsx"
      - "scripts/analyze_je_samples.py"
      - "requirements.txt"
      - ".github/workflows/je-samples-analysis.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis
        run: python scripts/analyze_je_samples.py

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: je-samples-outputs
          path: outputs

      - name: Upload Benford charts
        uses: actions/upload-artifact@v4
        with:
          name: benford-analysis
          path: outputs/benford
